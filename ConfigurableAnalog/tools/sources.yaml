# Single source of truth for settings, strings, on-device editor config and Monkey C keys.
# Run: python3 tools/gen_settings.py   (add --check to only validate)

default_skin: classic

# Phone settings store the position in this list, append only.
skins:
  - id: classic
    label: Classic
  - id: minimal
    label: Minimal
  - id: sport
    label: Sport

# Page types in enum order (PageTypes.GENERIC = 0, WEATHER = 1, HEALTH = 2). Append only.
page_types:
  - id: generic
    label: Generic (5 slots)
  - id: weather
    label: Weather
  - id: health
    label: Health

pages:
  max: 6
  slots_per_page: 5
  default_count: 3
  # Pages without an entry default to generic.
  default_types: [generic, weather, health]
  # Pages without an entry default to all Empty slots.
  defaults:
    - [Steps, HeartRate, Battery, NextEvent, BodyBattery]
    - [Weather, Sunrise, Sunset, Notifications, SecondTimeZone]
    - [Calories, Distance, FloorsClimbed, Stress, ActiveMinutes]

seconds_hand_modes:
  - id: skin
    label: Skin default
  - id: always
    label: Always
  - id: awakeOnly
    label: Awake only
  - id: never
    label: Never

# Per page hand style, setting page<N>hands. "skin" keeps the skin's own hands. Append only.
hand_styles:
  - id: skin
    label: Skin default
  - id: baton
    label: Baton
  - id: dauphine
    label: Dauphine
  - id: arrow
    label: Arrow
  - id: line
    label: Thin line
  - id: skeleton
    label: Skeleton

number_settings:
  - key: secondTimeZoneOffsetMinutes
    label: Second time zone, UTC offset in minutes
    default: 0
    min: -720
    max: 840
  - key: weatherRefreshMinutes
    label: Weather refresh interval in minutes
    default: 15
    min: 5
    max: 120

# Choice settings are stored as the index of the option (append only within each list).
choice_settings:
  - key: pressureUnit
    label: Pressure unit
    default: hPa
    options:
      - { id: hPa, label: hPa }
      - { id: mmHg, label: mmHg }
      - { id: inHg, label: inHg }
  - key: healthChart
    label: Health page chart (last 6 hours)
    default: bodyBattery
    options:
      - { id: bodyBattery, label: Body Battery }
      - { id: stress, label: Stress }
      - { id: spo2, label: Pulse Ox }
      - { id: heartRate, label: Heart rate }
  - key: effectsIntensity
    label: Weather effects intensity
    default: normal
    options:
      - { id: low, label: Low }
      - { id: normal, label: Normal }
      - { id: high, label: High }

boolean_settings:
  - { key: showSunTimes, label: Show sunrise and sunset times, default: true }
  - { key: showMoonPhaseLabel, label: Show moon phase name, default: true }
  - { key: effectsEnabled, label: Weather effects, default: true }
  - { key: effectsOnWristRaiseOnly, label: Weather effects only while awake, default: true }
  - { key: showColourSwatches, label: Debug, draw the 64 colour palette grid, default: false }

# id must match a registry entry in source/data/DataSourceRegistry.mc (a <id>Source class, or a
# ComplicationSource, WeatherFieldSource or DeviceFieldSource instance created with that id).
# Phone settings store the position in this list, so append new sources at the end and never reorder.
# complication is the Toybox.Complications type used by the on-device editor, or null
# when the source has no system complication equivalent (then it is phone-settings only).
sources:
  - { id: Empty,          label: Empty, short: EMPTY,             complication: null }
  - { id: Battery,        label: Battery, short: BATT,           complication: COMPLICATION_TYPE_BATTERY }
  - { id: Steps,          label: Steps, short: STEPS,             complication: COMPLICATION_TYPE_STEPS }
  - { id: HeartRate,      label: Heart rate, short: HR,        complication: COMPLICATION_TYPE_HEART_RATE }
  - { id: Date,           label: Date, short: DATE,              complication: COMPLICATION_TYPE_DATE }
  - { id: DayOfWeek,      label: Day of week, short: DAY,       complication: COMPLICATION_TYPE_WEEKDAY_MONTHDAY }
  - { id: BodyBattery,    label: Body Battery, short: BODY,      complication: COMPLICATION_TYPE_BODY_BATTERY }
  - { id: Stress,         label: Stress, short: STRESS,            complication: COMPLICATION_TYPE_STRESS }
  - { id: Calories,       label: Calories, short: KCAL,          complication: COMPLICATION_TYPE_CALORIES }
  - { id: Distance,       label: Distance, short: DIST,          complication: null }
  - { id: FloorsClimbed,  label: Floors climbed, short: FLOORS,    complication: COMPLICATION_TYPE_FLOORS_CLIMBED }
  - { id: Notifications,  label: Notifications, short: NOTIF,     complication: COMPLICATION_TYPE_NOTIFICATION_COUNT }
  - { id: Weather,        label: Temperature, short: TEMP,       complication: COMPLICATION_TYPE_CURRENT_TEMPERATURE }
  - { id: Sunrise,        label: Sunrise, short: SUNRISE,           complication: COMPLICATION_TYPE_SUNRISE }
  - { id: Sunset,         label: Sunset, short: SUNSET,            complication: COMPLICATION_TYPE_SUNSET }
  - { id: SecondTimeZone, label: Second time zone, short: TZ2,  complication: null }
  - { id: Altitude,       label: Altitude, short: ALT,          complication: COMPLICATION_TYPE_ALTITUDE }
  - { id: SolarIntensity, label: Solar intensity, short: SOLAR,   complication: COMPLICATION_TYPE_SOLAR_INPUT }
  - { id: ActiveMinutes,  label: Intensity minutes, short: INTENS, complication: COMPLICATION_TYPE_INTENSITY_MINUTES }
  - { id: NextEvent,      label: Next calendar event, short: EVENT, complication: COMPLICATION_TYPE_CALENDAR_EVENTS }
  - { id: PulseOx,        label: Pulse Ox, short: SPO2,            complication: COMPLICATION_TYPE_PULSE_OX }
  - { id: RespirationRate, label: Respiration rate, short: BREATH, complication: COMPLICATION_TYPE_RESPIRATION_RATE }
  - { id: RecoveryTime,   label: Recovery time, short: RECOVERY,  complication: COMPLICATION_TYPE_RECOVERY_TIME }
  - { id: SleepScore,     label: Sleep score, short: SLEEP,       complication: COMPLICATION_TYPE_SLEEP_SCORE }
  - { id: TrainingStatus, label: Training status, short: TRAINING, complication: COMPLICATION_TYPE_TRAINING_STATUS }
  - { id: Vo2Max,         label: VO2 max, short: VO2,             complication: COMPLICATION_TYPE_VO2MAX_RUN }
  - { id: Barometer,      label: Barometer (sea level), short: BARO, complication: COMPLICATION_TYPE_SEA_LEVEL_PRESSURE }
  - { id: HighLowTemp,    label: High and low temperature, short: HI/LO, complication: COMPLICATION_TYPE_HIGH_LOW_TEMPERATURE }
  - { id: Humidity,       label: Humidity, short: HUMID,          complication: null }
  - { id: Wind,           label: Wind speed, short: WIND,         complication: null }
  - { id: RainChance,     label: Rain chance, short: RAIN,        complication: null }
  - { id: UvIndex,        label: UV index, short: UV,             complication: null }
  - { id: FeelsLike,      label: Feels like temperature, short: FEELS, complication: null }
  - { id: BatteryDays,    label: Battery days left, short: DAYS,  complication: null }
  - { id: StepGoal,       label: Step goal progress, short: GOAL, complication: null }
